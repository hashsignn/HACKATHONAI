<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust+ Billing Reel</title>
  <meta name="description" content="Trust+ for KPMG: the billing mechanism in one minute. Every task priced by its HAAS lane, plus a value-added fee paid only when agreed objectives are met.">
  <link rel="stylesheet" href="reel.css">
</head>
<body>
  <div id="stage" class="mode-live chrome-off">
    <div class="bg" aria-hidden="true">
      <div class="aurora a1"></div>
      <div class="aurora a2"></div>
      <div class="aurora a3"></div>
      <div class="grid"></div>
    </div>
    <div class="watermark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect x="1.5" y="1.5" width="29" height="29" rx="9" fill="none" stroke="#00338d" stroke-width="2.4"/><path d="M9 17.5l4.2 4.2L23.5 11" fill="none" stroke="#00338d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Trust<b>+</b></span>
    </div>

    <header id="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00b8f5"/>
              <stop offset="1" stop-color="#ffffff"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="29" height="29" rx="9" fill="none" stroke="url(#markGrad)" stroke-width="2.4"/>
          <path d="M9 17.5l4.2 4.2L23.5 11" fill="none" stroke="url(#markGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="name">Trust<b>+</b></span>
        <span class="for">for KPMG</span>
      </div>
      <div class="scene-label">
        <span id="scene-side" class="side"></span>
        <span id="scene-num" class="num"></span>
        <span id="scene-title" class="title"></span>
      </div>
      <div class="controls">
        <div id="dots" class="dots"></div>
        <button id="mode-btn" class="pill" title="Switch between Live (you click) and Auto (plays itself)"></button>
        <button id="sound-btn" class="pill icon" title="Sound on/off"></button>
      </div>
    </header>

    <div id="story"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    <div id="pausebadge">❚❚ paused · Space to play</div>
    <main id="root"></main>
    <aside id="rail" aria-label="Engagement progress"></aside>

    <button id="next-hint" class="next-hint" type="button">Next <kbd>→</kbd></button>
    <div id="keys" class="keys">→ next &nbsp;·&nbsp; ← back &nbsp;·&nbsp; A auto &nbsp;·&nbsp; L live &nbsp;·&nbsp; R restart &nbsp;·&nbsp; S sound</div>

    <canvas id="fx" width="3200" height="1800" aria-hidden="true"></canvas>

    <div id="cursor" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6 3.9 7.2-2.9 1.5-3.9-7.2-4.9 4.6z" fill="#fff" stroke="#0b1020" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span class="who">Lea</span>
    </div>

    <div id="splash">
      <div class="splash-inner">
        <div class="splash-dot"></div>
        <div class="splash-text">Trust+</div>
        <div class="splash-sub">Click or press <kbd>Space</kbd> to play &nbsp;·&nbsp; <kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>→</kbd> skip</div>
      </div>
    </div>
  </div>
  <script src="reel.js"></script>
</body>
</html>
