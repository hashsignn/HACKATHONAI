# Tax. Compliance is recurring (retainer); opinions are one-off and relied on externally.

[department]
key = "tax"
name = "Tax"
summary = "Tax compliance, transfer pricing and tax opinions."

[policy]
options = ["classic", "per_deliverable", "retainer", "client_platform"]
min_review_level = "standard"
rationale = [
  "Tax positions are never priced on the tax saved: no outcome-linked fees.",
]

[[services]]
key = "corporate_tax_return"
