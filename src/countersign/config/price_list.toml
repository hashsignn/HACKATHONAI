# Published price list for the convergence model (illustrative numbers).
#
# Every deliverable is priced in two lines:
#   Judgment  = flat fee by complexity tier; the AI's research and drafting are included
#   Signature = a named person signs and KPMG carries the liability; priced by consequence
#
# A service may override its department's signature prices (e.g. a routine filing).
# historical_fee   = average fee for the same deliverable billed by the hour before AI
# reference_hours  = average human hours behind that historical fee
# Both come from the firm's billing and timesheet history and anchor the new prices.
# An engagement is locked to the version current when its pricing was confirmed.

version = "2026.10"
currency = "CHF"
client_platform_factor = 0.55   # Judgment when the client's own team prepares in KPMG's AI
retainer_discount = 0.15        # annual retainer vs buying the same deliverables one by one
retainer_deliverables = 12      # deliverables covered by a standard annual retainer

