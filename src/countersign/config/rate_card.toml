# Published rate card. Prices are per SIGNED milestone; nothing unsigned is billable.
#
# How the numbers are set (see docs/pricing.md):
#   * reference_hours = median hours this step took before AI, from historical timesheets.
#   * price           = set by the pricing committee, anchored on reference_hours x the
#                       reference rate, minus the share of the efficiency gain passed to the
#                       client, and weighted towards the human-judgment steps.
#   * A review level adds a published multiplier for the extra human review it requires.
# Illustrative numbers for the hackathon prototype.

version = "2026.10-hackathon"
currency = "CHF"
reference_hourly_rate = 250

[review_multipliers]
standard = 1.0
elevated = 1.2
critical = 1.5

[workflows.spa_contract_review.milestones.M1]
price = 500
reference_hours = 8

[workflows.spa_contract_review.milestones.M2]
price = 1000
reference_hours = 8

[workflows.spa_contract_review.milestones.M3]
price = 2000
reference_hours = 12

[workflows.spa_contract_review.milestones.M4]
price = 1500
reference_hours = 8

[workflows.spa_contract_review.milestones.M5]
price = 1000
reference_hours = 4

[subscription]
# Agent-led tier: annual fee covering a volume of engagements of this workflow.
annual_fee = 60000
included_engagements = 12
